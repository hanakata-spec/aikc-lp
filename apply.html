<html lang="ja">
<head>

<meta charset="UTF-8">

<title>招待面談のお申し込み | AI経営者クラブβ — 株式会社コミクス</title>
<link rel="icon" href="./favicon.ico">
<meta name="description" content="AI経営者クラブβへの招待面談お申し込みフォーム。完全招待制・経営者のためのメンバーシップ。株式会社コミクス運営。">

<link rel="canonical" href="https://club.comix.co.jp/apply.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5CRJNVT3"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<!-- ============ HEADER ============ -->
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="./index.html" aria-label="AI経営者クラブβ トップへ">
      <img src="images/logo.png" alt="AI経営者クラブβ ロゴ" class="brand-logo">
      <div class="brand-text">
        <span class="b-main">AI経営者クラブ β</span>
        <span class="b-sub">COMIX Inc.</span>
      </div>
    </a>
    <a class="btn btn-mini" href="./index.html">トップへ戻る</a>
  </div>
</header>

<!-- ============ APPLY FORM ============ -->
<section class="s-ink apply-section">
  <div class="narrow">
    <span class="eyebrow">By Invitation Only</span>
    <h1 class="sec-head">招待面談のお申し込み</h1>

    <form class="apply-form" id="applyForm" novalidate>
      <div class="field">
        <label for="f-company">会社名<span class="req">必須</span></label>
        <input type="text" id="f-company" name="company" autocomplete="organization" placeholder="例）株式会社コミクス" required>
      </div>

      <div class="field">
        <label for="f-name">お名前<span class="req">必須</span></label>
        <input type="text" id="f-name" name="name" autocomplete="name" placeholder="例）山田 太郎" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-email">メールアドレス<span class="req">必須</span></label>
          <input type="email" id="f-email" name="email" autocomplete="email" placeholder="例）info@example.com" required>
        </div>
        <div class="field">
          <label for="f-tel">電話番号<span class="req">必須</span></label>
          <input type="tel" id="f-tel" name="tel" autocomplete="tel" placeholder="例）03-5459-5394" required pattern="[0-9\-\(\)\+\s]+" title="電話番号は数字・ハイフンのみで入力してください">
          <span class="field-error" id="tel-error" style="display:none;color:#e05;font-size:13px;margin-top:4px;display:none;">電話番号は数字・ハイフンのみで入力してください</span>
        </div>
      </div>

      <div class="field">
        <label for="f-referrer">ご紹介者名<span class="opt">任意</span></label>
        <input type="text" id="f-referrer" name="referrer" placeholder="会員またはご紹介者のお名前">
      </div>

      <div class="field">
        <label for="f-message">ご相談内容<span class="opt">任意</span></label>
        <textarea id="f-message" name="message" rows="5" placeholder="現在の課題や、面談で伺いたいことなど"></textarea>
      </div>

      <p class="privacy-note">※<a href="https://www.comix.co.jp/handling-of-personal-information/" target="_blank" rel="noopener" style="text-decoration:underline;text-underline-offset:3px;">個人情報の取り扱いについて</a>をご確認ください<br>※ご入力された個人情報は本件目的以外に利用することはありません</p>
      <button type="submit" class="btn btn-primary big apply-submit">確認画面へ</button>
    </form>
  </div>
</section>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <div class="narrow">
    <div class="f-brand"><img src="images/logo.png" alt="AI経営者クラブβ ロゴ" class="brand-logo">AI経営者クラブ β</div>
    <div class="f-co"><a href="https://www.comix.co.jp/" target="_blank" rel="noopener">株式会社コミクス</a></div>
    <div class="f-copy">© COMIX Inc. 2026</div>
  </div>
</footer>

<script>
(function(){
  var form = document.getElementById('applyForm');
  if(!form){ return; }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(typeof form.reportValidity === 'function' && !form.reportValidity()){
      return;
    }

    var v = function(id){ return (document.getElementById(id).value || '').trim(); };
    sessionStorage.setItem('aikc_form', JSON.stringify({
      company:  v('f-company'),
      name:     v('f-name'),
      email:    v('f-email'),
      tel:      v('f-tel'),
      referrer: v('f-referrer'),
      message:  v('f-message')
    }));

    window.location.href = './confirm.html';
  });
})();
</script>

</body>
</html>
